name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEY != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The action defaults to `packages: tools platform-tools`, but the
        # legacy `tools` package was removed from the Google SDK repository,
        # so `sdkmanager tools` fails with "Failed to find package 'tools'"
        # and kills the job before Gradle ever runs. Only request what we need.
        packages: 'platform-tools'

    - uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Sign app APK
      id: sign_app
      if: env.HAS_SIGNING == 'true'
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload signed APK
      if: env.HAS_SIGNING == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: app/build/outputs/apk/release/*-arm64-v8a-release-signed.apk
        if-no-files-found: error
        retention-days: 20

    - name: Upload unsigned APK
      if: env.HAS_SIGNING != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-apks
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 20
