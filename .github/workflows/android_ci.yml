name: Android CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to `packages: tools platform-tools`, but the
          # legacy `tools` package was removed from the Google SDK repository,
          # so `sdkmanager tools` fails with "Failed to find package 'tools'"
          # and kills the job before Gradle ever runs. Only request what we need.
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew buildGenericRelease
